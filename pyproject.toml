[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "documind"
version = "0.1.0"
description = "An open-source AI document Retrieval-Augmented Generation assistant built with FastAPI, LangChain, ChromaDB, SQLAlchemy, and MySQL."
requires-python = ">=3.11,<3.13"

license = { text = "MIT" }

authors = [
    { name = "Omar Mohamed Abdulraheim Elgendey" }
]

dependencies = [
    # API & Web Framework
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",

    # Settings & Environment
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",

    # Database & ORM
    "sqlalchemy>=2.0.52",
    "pymysql>=1.2.0",

    # Vector Storage
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",

    # LangChain
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-classic>=1.0.8",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langsmith>=0.12.0",

    # LLM Integrations
    "google-genai>=2.21.0",
    "langchain-google-genai>=4.3.7",
    "groq>=0.37.1",
    "langchain-groq>=1.1.3",

    # Embeddings
    "fastembed>=0.4.0",

    # Tokenization
    "tiktoken>=0.14.0",

    # Document Processing
    "pypdf>=6.16.2",
    "pymupdf>=1.28.2",
    "docx2txt>=0.9",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",

    # Templates / HTTP
    "jinja2>=3.1.6",
    "requests>=2.31.0",
    "httpx>=0.27.0",

    # Scientific Computing
    "numpy>=2.0,<3.0",
]


[project.urls]
Homepage = "https://github.com/OmarElgendey/DocuMind"
Repository = "https://github.com/OmarElgendey/DocuMind"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "build>=1.6.0",
    "rich>=15.0.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]